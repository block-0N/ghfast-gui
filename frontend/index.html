<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ghfast-gui</title>
</head>

<body>
    <div id="app">
        <h1>ghfast GUI</h1>
        <details id="settings">
            <summary>⚙ 代理设置</summary>
            <div class="settings-body">
                <input id="proxy-input" type="text" placeholder="http://127.0.0.1:7890（留空 = 直连或使用环境变量）">
                <button id="save-proxy-btn">保存</button>
                <span id="proxy-status"></span>
            </div>
        </details>
        <div class="row">
            <input id="url-input" type="text" placeholder="粘贴 GitHub Release 直链 / Run 链接 / Artifact API 链接">
            <button id="parse-btn">解析</button>
        </div>

        <pre id="result"></pre>

        <div id="progress-wrap" style="display:none;">
            <div class="progress-track">
                <div id="progress-bar" class="progress-fill"></div>
            </div>
            <div id="progress-text" class="progress-text"></div>
        </div>

        <div class="actions">
            <button id="download-btn" style="display:none;">下载</button>
            <button id="cancel-btn" class="btn-secondary" style="display:none;">取消</button>
        </div>

        <div id="history-section" style="display:none;">
            <h2>历史记录</h2>
            <ul id="history-list"></ul>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
