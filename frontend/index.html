<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ghfast-gui</title>
</head>

<body>
    <div id="app">
        <h1>ghfast GUI</h1>

        <div class="row">
            <input id="url-input" type="text" placeholder="粘贴 GitHub Release 文件直链">
            <button id="parse-btn">解析</button>
        </div>
        <div class="hint">多线程（8 并发）+ 断点续传。中断后重新点下载会从断点继续。</div>
        <pre id="result"></pre>

        <div id="progress-wrap" style="display:none;">
            <div class="progress-track">
                <div id="progress-bar" class="progress-fill"></div>
            </div>
            <div id="progress-text" class="progress-text"></div>
        </div>

        <button id="download-btn" style="display:none; margin-top:16px;">下载</button>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
