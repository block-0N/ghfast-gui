name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          $candidates = @(
            "C:\Program Files (x86)\NSIS",
            "C:\Program Files\NSIS"
          )
          $found = $null
          foreach ($p in $candidates) {
            if (Test-Path "$p\makensis.exe") {
              $found = $p
              break
            }
          }
          if (-not $found) {
            Write-Host "搜索 makensis.exe..."
            $hit = Get-ChildItem "C:\" -Recurse -Filter "makensis.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hit) { $found = $hit.DirectoryName }
          }
          if ($found) {
            Write-Host "找到 NSIS: $found"
            echo $found >> $env:GITHUB_PATH
          } else {
            Write-Error "未找到 makensis.exe"
          }
        shell: pwsh

      - name: Build
        run: wails build -platform windows/amd64 -clean -nsis

      - uses: actions/upload-artifact@v4
        with:
          name: ghfast-gui-windows-amd64
          path: |
            build/bin/ghfast-gui.exe
            build/bin/*installer.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true